name: App Store Distribution

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract project runtime
        run: echo "Extracting environment..."

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor iOS platform
        run: npx cap sync ios

      - name: Set up Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundle-cache: true

      - name: Run Fastlane Deploy
        run: bundle exec fastlane deploy
        env:
          FASTLANE_API_KEY_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          FASTLANE_API_KEY_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          FASTLANE_API_KEY_KEY_CONTENT: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
