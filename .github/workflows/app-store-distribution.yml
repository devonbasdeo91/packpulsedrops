name: App Store Distribution
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Extract project archive
        run: |
          unzip -o "pack-pulse-drops (7).zip" -d .
          
      - name: Install npm dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor iOS platform
        run: npx cap sync ios

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Upload IPA with Fastlane
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
        run: |
          set -euo pipefail
          export FASTLANE_TEAM_ID="${{ secrets.FASTLANE_TEAM_ID }}"
          echo "${{ secrets.APPSTORE_PRIVATE_KEY }}" | base64 --decode > AuthKey_Active.p8
          export APP_STORE_CONNECT_API_KEY_KEY="$(cat AuthKey_Active.p8)"
          bundle exec fastlane ios deploy
