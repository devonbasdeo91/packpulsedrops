name: App Store Distribution
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Extract project archive
        run: |
          unzip -o "pack-pulse-drops (7).zip" -d .
          
      - name: Install npm dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor iOS platform
        run: npx cap sync ios

      - name: Force Automatic Code Signing Mode
        run: |
          node -e "
          const fs = require('fs');
          const path = './ios/App/App.xcodeproj/project.pbxproj';
          if (fs.existsSync(path)) {
            let content = fs.readFileSync(path, 'utf8');
            content = content.replace(/ProvisioningStyle = Manual;/g, 'ProvisioningStyle = Automatic;');
            fs.writeFileSync(path, content, 'utf8');
            console.log('Successfully flipped Xcode project properties to Automatic Signing!');
          } else {
            console.log('Warning: project.pbxproj target path not detected.');
          }
          "

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Upload IPA with Fastlane
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID || secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
        run: |
          set -euo pipefail
          export FASTLANE_TEAM_ID="${{ secrets.FASTLANE_TEAM_ID }}"
          bundle exec fastlane ios deploy
