name: Deploy to TestFlight

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Find IPA file
        id: find_ipa
        shell: bash
        run: |
          set -euo pipefail
          ipa_path="$(find . -maxdepth 2 -type f -name '*.ipa' | head -n 1)"
          if [ -z "$ipa_path" ]; then
            echo "::error::No .ipa file found in the repository. Please upload your IPA from Base44."
            exit 1
          fi
          echo "Found IPA: $ipa_path"
          echo "ipa_path=$ipa_path" >> "$GITHUB_OUTPUT"

      - name: Upload IPA to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ steps.find_ipa.outputs.ipa_path }}
          app-type: ios
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
