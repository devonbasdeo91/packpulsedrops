name: Deploy to TestFlight

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract root ZIP archive
        id: extract_zip
        shell: bash
        run: |
          set -euo pipefail

          archive="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"
          if [ -z "$archive" ]; then
            echo "::error::No ZIP file found in the repository root."
            exit 1
          fi

          rm -rf extracted_app
          mkdir -p extracted_app
          unzip -q "$archive" -d extracted_app

          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Find IPA file
        id: find_ipa
        shell: bash
        run: |
          set -euo pipefail

          ipa_path="$(find extracted_app -type f -name '*.ipa' | head -n 1)"
          if [ -z "$ipa_path" ]; then
            echo "::error::No .ipa file found inside extracted_app after extracting ${{ steps.extract_zip.outputs.archive }}."
            exit 1
          fi

          echo "ipa_path=$ipa_path" >> "$GITHUB_OUTPUT"

      - name: Upload IPA to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ${{ steps.find_ipa.outputs.ipa_path }}
          app-type: ios
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
