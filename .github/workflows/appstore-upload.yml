name: Upload to TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Optional direct IPA download URL"
        required: false
        type: string

# Secrets supported (set at least one auth method):
#
# METHOD 1 - App Store Connect API key (preferred, from App Store Connect > Users & Access > Integrations):
#   ASC_KEY_ID        - Key ID (e.g. ABC123XYZ)
#   ASC_ISSUER_ID     - Issuer ID (UUID)
#   ASC_PRIVATE_KEY   - Contents of the .p8 file (raw or base64)
#
# METHOD 2 - Distribution certificate (.p12) from Apple Developer portal:
#   DIST_CERTIFICATE          - base64-encoded .p12 file  (run: base64 -i cert.p12 | pbcopy)
#   DIST_CERTIFICATE_PASSWORD - password for the .p12 file
#   APPLE_ID                  - your Apple ID email
#   APPLE_ID_PASSWORD         - app-specific password from appleid.apple.com
#   APP_IDENTIFIER            - bundle ID (e.g. com.example.app)
#   TEAM_ID                   - Apple Developer Team ID

jobs:
  upload:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Resolve IPA
        id: resolve_ipa
        env:
          INPUT_IPA_URL: ${{ github.event.inputs.ipa_url }}
          SECRET_IPA_URL: ${{ secrets.IPA_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build

          if [ -n "${INPUT_IPA_URL:-}" ]; then
            echo "Downloading IPA from workflow input URL..."
            curl -fL "${INPUT_IPA_URL}" -o build/app.ipa
          elif [ -n "${SECRET_IPA_URL:-}" ]; then
            echo "Downloading IPA from IPA_URL secret..."
            curl -fL "${SECRET_IPA_URL}" -o build/app.ipa
          else
            echo "Looking for IPA in latest GitHub Release..."
            gh release download --repo "${GITHUB_REPOSITORY}" --pattern "*.ipa" --dir build --clobber 2>/dev/null || true
            found="$(find build -maxdepth 1 -name '*.ipa' | head -n 1)"
            if [ -n "$found" ]; then
              mv "$found" build/app.ipa
            fi
          fi

          if [ ! -f build/app.ipa ]; then
            echo "::error::No IPA found. Upload an IPA to the GitHub Release at https://github.com/${GITHUB_REPOSITORY}/releases, or provide ipa_url as a workflow input."
            exit 1
          fi

          echo "ipa_path=build/app.ipa" >> "$GITHUB_OUTPUT"
          echo "IPA resolved: build/app.ipa ($(du -sh build/app.ipa | cut -f1))"

      - name: Install certificate and upload via API key
        if: ${{ secrets.ASC_KEY_ID != '' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          IPA_PATH: ${{ steps.resolve_ipa.outputs.ipa_path }}
        run: |
          set -euo pipefail
          # Normalise key: accept raw .p8 or base64-encoded .p8
          if printf '%s' "$ASC_PRIVATE_KEY" | grep -q "BEGIN"; then
            export ASC_PRIVATE_KEY_B64="$(printf '%s' "$ASC_PRIVATE_KEY" | base64 | tr -d '\n')"
          else
            export ASC_PRIVATE_KEY_B64="$ASC_PRIVATE_KEY"
          fi
          ASC_PRIVATE_KEY="$ASC_PRIVATE_KEY_B64" bundle exec fastlane ios upload_to_testflight

      - name: Install certificate and upload via .p12 + Apple ID
        if: ${{ secrets.ASC_KEY_ID == '' && secrets.DIST_CERTIFICATE != '' }}
        env:
          DIST_CERTIFICATE: ${{ secrets.DIST_CERTIFICATE }}
          DIST_CERTIFICATE_PASSWORD: ${{ secrets.DIST_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APP_IDENTIFIER: ${{ secrets.APP_IDENTIFIER }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          IPA_PATH: ${{ steps.resolve_ipa.outputs.ipa_path }}
        run: |
          set -euo pipefail

          # Decode and import the .p12 distribution certificate into a temporary keychain
          echo "$DIST_CERTIFICATE" | base64 --decode > /tmp/dist_cert.p12
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import /tmp/dist_cert.p12 -P "$DIST_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm /tmp/dist_cert.p12

          bundle exec fastlane ios upload_p12

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Upload to TestFlight failed. Check the logs above for details."
          echo "::notice::AUTH METHOD 1 (API key): Set secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY (from App Store Connect > Users & Access > Integrations > App Store Connect API)."
          echo "::notice::AUTH METHOD 2 (certificate): Set secrets DIST_CERTIFICATE (base64 .p12), DIST_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_ID_PASSWORD, APP_IDENTIFIER, TEAM_ID."
