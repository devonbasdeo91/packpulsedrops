name: Upload to TestFlight

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download IPA from release v1.0
        run: |
          mkdir -p build
          curl -L \
            -H "Accept: application/octet-stream" \
            -o build/PackPulseDrops.ipa \
            "https://github.com/${{ github.repository }}/releases/download/v1.0/ios-2.130297.1.2.ipa"

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: build/PackPulseDrops.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Upload to TestFlight failed. Check the logs above for details."
          echo "::notice::Ensure APPSTORE_ISSUER_ID, APPSTORE_KEY_ID, and APPSTORE_PRIVATE_KEY secrets are set."
