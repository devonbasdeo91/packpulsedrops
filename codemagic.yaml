workflows:
  build-web:
    name: Build and Test
    instance_type: linux
    triggering:
      events:
        - push
        - pull_request
    environment:
      node: 18
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build application
        script: npm run build
      - name: Run tests
        script: npm test -- --passWithNoTests --watchAll=false
    artifacts:
      - build/**/*
    publishing:
      email:
        recipients:
          - devonbasdeo91@example.com
        notify:
          success: true
          failure: true
