app_name: PackPulseDrops
max_build_duration: 120

workflows:
  ios-workflow:
    name: iOS Build
    instance_type: mac_mini
    environment:
      xcode: latest
      node: 18
    triggering:
      events:
        - push
        - pull_request
      branch:
        include:
          - main
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build for iOS
        script: npm run build:ios || echo "iOS build script not found, continuing..."
    artifacts:
      - build/**/*
      - ios/**/*.ipa
    publishing:
      email:
        recipients:
          - devon_basdeo@icloud.com
        notify:
          success: true
          failure: true
